name: PR Validation

# Runs on every pull request into main. Deliberately kept separate from ci.yml:
# this one reports per-check status so a failure points at the cause directly,
# which matters while reviewing. ci.yml verifies the merged result.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate Pull Request
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Steps are listed individually rather than via `npm run verify` so the
      # failing check is visible without opening the log.
      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      # Catches a regression that shipped once already: `alternates` and
      # `openGraph` are inherited from the root layout, so a page that omits
      # them silently declares the homepage as its canonical URL and drops
      # out of the index. Runs against the build output above.
      - name: Check route metadata
        run: npm run check:metadata

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      # The image build is the only check that exercises the standalone output
      # and the COPY paths. One of those broke once: `public/` is empty and git
      # does not track empty directories, so `COPY /app/public` failed from a
      # clean clone while local builds kept working.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: fernandez-consulting:pr
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Building proves it compiles; serving proves the runtime stage is wired
      # up — correct working directory, server.js present, static assets copied.
      - name: Serve the image and check every route
        run: |
          set -euo pipefail
          docker run -d --name pr-smoke -p 3000:3000 fernandez-consulting:pr

          for attempt in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:3000; then
              echo "container ready after ${attempt} attempt(s)"
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "::error::container did not become ready"
              docker logs pr-smoke
              exit 1
            fi
            sleep 2
          done

          status=0
          for route in / /program-direction /approach /leadership /contact /privacy /sitemap.xml /robots.txt; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000${route}")
            if [ "$code" = "200" ]; then
              printf 'ok   %-20s %s\n' "$route" "$code"
            else
              printf 'FAIL %-20s %s\n' "$route" "$code"
              status=1
            fi
          done

          if [ "$status" -ne 0 ]; then
            docker logs pr-smoke
          fi
          docker rm -f pr-smoke >/dev/null
          exit $status
