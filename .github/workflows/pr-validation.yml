name: PR Validation

# Runs on every pull request into main. Deliberately kept separate from ci.yml:
# this one reports per-check status and posts it back to the PR, so a failure
# names its cause without opening a log. ci.yml verifies the merged result.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  notify:
    name: Announce
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - name: Comment in progress
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- pr-validation-bot -->';
            const body = [
              marker,
              '### PR Validation — running',
              '',
              `**Commit:** \`${context.payload.pull_request.head.sha.slice(0, 7)}\``,
              `**Branch:** \`${context.payload.pull_request.head.ref}\``,
              '',
              '| Check | Result |',
              '| --- | --- |',
              '| Type check | ⏳ |',
              '| Lint | ⏳ |',
              '| Format | ⏳ |',
              '| Build | ⏳ |',
              '| Route metadata | ⏳ |',
              '| Production audit | ⏳ |',
              '| Docker build + smoke test | ⏳ |',
              '',
              `[View run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              (c) => c.user.type === 'Bot' && c.body.startsWith(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  validate:
    name: Validate Pull Request
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      typecheck: ${{ steps.typecheck.outcome }}
      lint: ${{ steps.lint.outcome }}
      format: ${{ steps.format.outcome }}
      build: ${{ steps.build.outcome }}
      metadata: ${{ steps.metadata.outcome }}
      audit: ${{ steps.audit.outcome }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Each check runs to completion rather than aborting the job, so the
      # summary comment reports every result instead of stopping at the first
      # failure. The gate at the end fails the job if any did.
      - name: Type check
        id: typecheck
        continue-on-error: true
        run: npm run type-check

      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: Format check
        id: format
        continue-on-error: true
        run: npm run format:check

      - name: Build
        id: build
        continue-on-error: true
        run: npm run build

      # Catches a regression that shipped once already: `alternates` and
      # `openGraph` are inherited from the root layout, so a page that omits
      # them silently loses its canonical URL and drops out of the index.
      - name: Check route metadata
        id: metadata
        continue-on-error: true
        run: npm run check:metadata

      - name: Audit production dependencies
        id: audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Gate
        run: |
          failed=""
          [ "${{ steps.typecheck.outcome }}" = "success" ] || failed="$failed type-check"
          [ "${{ steps.lint.outcome }}"      = "success" ] || failed="$failed lint"
          [ "${{ steps.format.outcome }}"    = "success" ] || failed="$failed format"
          [ "${{ steps.build.outcome }}"     = "success" ] || failed="$failed build"
          [ "${{ steps.metadata.outcome }}"  = "success" ] || failed="$failed metadata"
          [ "${{ steps.audit.outcome }}"     = "success" ] || failed="$failed audit"
          if [ -n "$failed" ]; then
            echo "::error::failed checks:$failed"
            exit 1
          fi
          echo "all checks passed"

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      # The image build is the only check that exercises the standalone output
      # and the COPY paths. One of those broke once: `public/` is empty and git
      # does not track empty directories, so `COPY /app/public` failed from a
      # clean clone while local builds kept working.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: fernandez-consulting:pr
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Building proves it compiles; serving proves the runtime stage is wired
      # up — correct working directory, server.js present, static assets copied.
      - name: Serve the image and check every route
        run: |
          set -euo pipefail
          docker run -d --name pr-smoke -p 3000:3000 fernandez-consulting:pr

          for attempt in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:3000; then
              echo "container ready after ${attempt} attempt(s)"
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "::error::container did not become ready"
              docker logs pr-smoke
              exit 1
            fi
            sleep 2
          done

          status=0
          for route in / /program-direction /approach /leadership /contact /privacy /sitemap.xml /robots.txt; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000${route}")
            if [ "$code" = "200" ]; then
              printf 'ok   %-20s %s\n' "$route" "$code"
            else
              printf 'FAIL %-20s %s\n' "$route" "$code"
              status=1
            fi
          done

          if [ "$status" -ne 0 ]; then
            docker logs pr-smoke
          fi
          docker rm -f pr-smoke >/dev/null
          exit $status

  report:
    name: Report
    runs-on: ubuntu-latest
    needs: [validate, docker]
    if: always() && github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - name: Comment result
        uses: actions/github-script@v9
        env:
          TYPECHECK: ${{ needs.validate.outputs.typecheck }}
          LINT: ${{ needs.validate.outputs.lint }}
          FORMAT: ${{ needs.validate.outputs.format }}
          BUILD: ${{ needs.validate.outputs.build }}
          METADATA: ${{ needs.validate.outputs.metadata }}
          AUDIT: ${{ needs.validate.outputs.audit }}
          DOCKER: ${{ needs.docker.result }}
        with:
          script: |
            const marker = '<!-- pr-validation-bot -->';

            const checks = [
              ['Type check', process.env.TYPECHECK],
              ['Lint', process.env.LINT],
              ['Format', process.env.FORMAT],
              ['Build', process.env.BUILD],
              ['Route metadata', process.env.METADATA],
              ['Production audit', process.env.AUDIT],
              ['Docker build + smoke test', process.env.DOCKER],
            ];

            const icon = (o) =>
              o === 'success' ? '✅ pass'
              : o === 'skipped' ? '⏭️ skipped'
              : o === 'cancelled' ? '⚪ cancelled'
              : '❌ fail';

            const failed = checks.filter(
              ([, o]) => o && o !== 'success' && o !== 'skipped',
            );
            const ok = failed.length === 0;

            const body = [
              marker,
              `### PR Validation — ${ok ? 'passed' : 'failed'}`,
              '',
              `**Commit:** \`${context.payload.pull_request.head.sha.slice(0, 7)}\``,
              `**Branch:** \`${context.payload.pull_request.head.ref}\``,
              '',
              '| Check | Result |',
              '| --- | --- |',
              ...checks.map(([name, o]) => `| ${name} | ${icon(o)} |`),
              '',
              ok
                ? 'All checks passed.'
                : `Blocking: ${failed.map(([n]) => `**${n}**`).join(', ')}.`,
              '',
              `[View run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              (c) => c.user.type === 'Bot' && c.body.startsWith(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
