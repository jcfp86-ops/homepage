<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Fernandez Consulting — Global SaMD Program Direction">
  <rect width="1280" height="400" fill="#0a1e31"/>

  <!-- Wordmark: block mark + name -->
  <g transform="translate(80, 60)">
    <rect width="40" height="40" fill="#f3f6f8"/>
    <g transform="translate(12, 9)" fill="#0a1e31">
      <rect x="0" y="0" width="3.8" height="22"/>
      <rect x="0" y="0" width="17.6" height="3.8"/>
      <rect x="0" y="9.4" width="12" height="3.8"/>
    </g>
    <text x="56" y="27" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#f3f6f8">Fernandez Consulting</text>
  </g>

  <!-- Headline -->
  <text x="80" y="206" font-family="Georgia, 'Times New Roman', serif" font-size="54" fill="#f3f6f8" letter-spacing="-1.2">Global SaMD Program Direction</text>

  <!-- Positioning -->
  <text x="80" y="252" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#9db0c2">We do not conclude at recommendations. We remain accountable for outcomes.</text>

  <!-- Rule -->
  <rect x="80" y="300" width="1120" height="1" fill="#1c3a52"/>

  <!-- Standards -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#86b4e4" letter-spacing="1.2">
    <text x="80" y="336">FDA 510(k)</text>
    <text x="206" y="336">EU MDR</text>
    <text x="306" y="336">UKCA</text>
    <text x="386" y="336">IEC 62304</text>
    <text x="498" y="336">ISO 13485</text>
    <text x="610" y="336">ISO 14971</text>
    <text x="722" y="336">HL7 FHIR</text>
    <text x="828" y="336">MDSAP</text>
  </g>
</svg>
